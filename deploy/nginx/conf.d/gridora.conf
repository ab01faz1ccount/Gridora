# Gridora: TLS, static web app, /api reverse proxy.  Listens on 8080/8443 (non-root image).

# Second layer of login throttling; the API's own Postgres-backed limiter is the primary one.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_status 429;

upstream gridora_api { server api:8000; keepalive 16; }

server {
  listen 8080;
  server_name _;
  location = /nginx-health { access_log off; default_type text/plain; return 200 "ok\n"; }
  location / { return 308 https://$host$request_uri; }   # assumes the public HTTPS port is 443
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1h;
  ssl_session_tickets off;

  # Default body limit is small; the upload location raises it.
  client_max_body_size 1m;

  # nginx-generated errors use the same JSON envelope as the API (API_CONTRACTS section 1).
  error_page 413 = @err_413;
  error_page 429 = @err_429;
  error_page 502 503 504 = @err_5xx;
  location @err_413 {
    internal; default_type application/json; include /etc/nginx/snippets/security-headers.conf;
    return 413 '{"error":{"code":"file_too_large","message":"The file is too large.","details":[],"request_id":"$request_id"}}';
  }
  location @err_429 {
    internal; default_type application/json; include /etc/nginx/snippets/security-headers.conf;
    return 429 '{"error":{"code":"rate_limited","message":"Too many requests; try again later.","details":[],"request_id":"$request_id"}}';
  }
  location @err_5xx {
    internal; default_type application/json; include /etc/nginx/snippets/security-headers.conf;
    return 503 '{"error":{"code":"internal_error","message":"The service is temporarily unavailable.","details":[],"request_id":"$request_id"}}';
  }

  # --- API -------------------------------------------------------------------------------
  # The API sets its own security headers; only HSTS is added here.
  location /api/ {
    proxy_pass http://gridora_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;             # the API trusts this header (nginx is its only client)
    proxy_set_header X-Forwarded-For $remote_addr;       # overwritten, never appended: no client spoofing
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;           # same id in nginx and API logs
    proxy_read_timeout 120s;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  location = /api/v1/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://gridora_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Uploads: up to 100 MiB of file (+ multipart framing) and STREAMED to the API (no nginx spool).
  location ~ ^/api/v1/workspaces/[^/]+/files$ {
    client_max_body_size 101m;
    proxy_request_buffering off;
    proxy_pass http://gridora_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # --- static web app --------------------------------------------------------------------
  root /usr/share/nginx/html;

  location /assets/ {      # content-hashed file names
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /fonts/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;   # single-page app routes (/login, /workspaces)
  }
}
