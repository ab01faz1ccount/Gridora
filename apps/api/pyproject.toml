[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridora-api"
version = "0.0.1"
description = "Gridora HTTP API and composition layer"
requires-python = ">=3.11"
# gridora-contracts is installed from the repo first: pip install -e ../../contracts/python
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]>=2",
  "alembic",
  "asyncpg",
  "argon2-cffi",
  "python-multipart",
]

[project.optional-dependencies]
# Tool versions are PINNED on purpose: an unpinned linter that updates itself can turn CI red
# with no change in our code. Bump them deliberately, in their own PR (re-run ruff/mypy, fix, commit).
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "httpx==0.28.1",
  "ruff==0.17.5",
  "mypy==2.4.1",
  "psycopg2-binary==2.9.13",  # only for the migrations-vs-models test
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-first-party = ["gridora_api"]
known-third-party = ["gridora_contracts"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src:../../contracts/python"
