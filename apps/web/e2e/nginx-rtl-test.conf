# TEST ONLY. The stub engine never produces right-to-left sheets, so check_rtl.py needs the sheet
# metadata to say rtl:true. Put this location block inside the HTTPS `server {}` of deploy/nginx/conf.d,
# before `location = /api/v1/auth/login`, for the duration of the test. It rewrites one JSON field.
location ~ ^/api/v1/workbooks/[^/]+$ {
  proxy_pass http://gridora_api; proxy_http_version 1.1; proxy_set_header Connection "";
  proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Request-ID $request_id;
  proxy_set_header Accept-Encoding "";
  sub_filter_types application/json; sub_filter '"rtl":false' '"rtl":true'; sub_filter_once off;
}
