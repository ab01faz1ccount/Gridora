# Reviewed and committed by Agent 0 (source: agent proposal under ci/).
name: apps-web
permissions:
  contents: read
on:
  pull_request:
    paths: ["apps/web/**", "contracts/typescript/**"]
  push:
    branches: [main]
    paths: ["apps/web/**", "contracts/typescript/**"]
jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build
