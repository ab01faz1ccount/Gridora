[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridora-dataops"
version = "0.0.1"
description = "Gridora data operations, pipelines and Data Tables (Agent 2)"
requires-python = ">=3.11"
dependencies = [
    "gridora-contracts",
    "polars>=2.1,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "jsonschema>=4.20", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gridora_dataops = ["i18n/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = ["UP007", "UP045"]  # Optional[X] is used on purpose (pydantic models, same style as contracts)

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "../../contracts/python"

