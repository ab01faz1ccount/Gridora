[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridora-engine"
version = "0.0.1"
description = "Gridora workbook engine: XLSX/CSV I/O, cell store, formulas, compatibility reports"
requires-python = ">=3.11"
# gridora-contracts is installed from the repo (contracts/python); it is not on PyPI.
dependencies = ["gridora-contracts", "pydantic>=2.6,<3"]

[project.optional-dependencies]
# Tool versions are pinned on purpose: an unpinned ruff/mypy update must not turn CI red
# by itself. Bump them deliberately, together with any fixes.
dev = ["pytest>=8,<10", "ruff==0.17.5", "mypy==2.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/../../contracts/python"

# E7 formula core: a dynamically-typed AST evaluator (nodes dispatched by class, values are
# float|str|bool|XlError|Arr). Strict generic/Any/union checks are relaxed for these modules
# only; typing them fully is tracked as follow-up. Everything else stays strict.
[[tool.mypy.overrides]]
module = ["gridora_engine.formula.*", "gridora_engine.calc.*"]
disable_error_code = ["union-attr", "no-any-return", "type-arg", "no-untyped-def", "no-untyped-call", "has-type", "attr-defined", "arg-type", "var-annotated"]
