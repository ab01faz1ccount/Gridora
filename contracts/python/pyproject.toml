[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridora-contracts"
version = "0.1.0"
description = "Shared Gridora data contracts and module interfaces"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["gridora_contracts*"]
